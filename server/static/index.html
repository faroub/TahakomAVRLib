<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TahakomAVR Dev Environment & Telemetry Platform</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace; background: #181824; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #222234; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #33334d; }
        .logo { font-weight: bold; font-size: 1.2rem; color: #00d2ff; }
        .toolbar { display: flex; gap: 12px; align-items: center; }
        select, button { padding: 8px 14px; background: #2c2c44; color: #fff; border: 1px solid #444466; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
        button:hover { background: #3b3b5c; }
        button.primary { background: #0088ff; border-color: #0077ee; font-weight: bold; }
        button.primary:hover { background: #0077ee; }
        button.success { background: #00b894; border-color: #00a383; font-weight: bold; }
        button.success:hover { background: #00a383; }

        .main-container { display: flex; flex: 1; overflow: hidden; }
        .editor-pane { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #33334d; }
        .pane-header { background: #1e1e2d; padding: 8px 12px; font-size: 0.85rem; font-weight: bold; color: #aaa; border-bottom: 1px solid #2a2a3d; display: flex; justify-content: space-between; }
        #code-editor { flex: 1; background: #12121c; color: #66d9ef; padding: 14px; font-family: "Courier New", Courier, monospace; font-size: 0.95rem; border: none; outline: none; resize: none; width: 100%; height: 100%; line-height: 1.4; }

        .dashboard-pane { flex: 1; display: flex; flex-direction: column; background: #161622; overflow-y: auto; padding: 12px; gap: 12px; }
        .card { background: #202032; border-radius: 6px; padding: 12px; border: 1px solid #2e2e48; }
        .card-title { font-size: 0.9rem; font-weight: bold; color: #00d2ff; margin-bottom: 8px; }
        canvas { width: 100%; height: 160px; background: #0d0d14; border-radius: 4px; display: block; }

        .widget-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        .widget { background: #181826; padding: 10px; border-radius: 4px; text-align: center; border: 1px solid #28283d; }
        .widget-val { font-size: 1.4rem; font-weight: bold; color: #55efc4; margin-top: 4px; }

        .terminal-pane { height: 160px; background: #0a0a10; border-top: 1px solid #33334d; padding: 10px; font-family: monospace; font-size: 0.85rem; color: #33ff33; overflow-y: auto; }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ TahakomAVR Platform</div>
        <div class="toolbar">
            <label for="mcu-select">MCU:</label>
            <select id="mcu-select">
                <option value="atmega328p">ATmega328P (Arduino Uno/Nano)</option>
                <option value="atmega2560">ATmega2560 (Arduino Mega)</option>
                <option value="atmega168p">ATmega168P</option>
                <option value="attiny85">ATtiny85</option>
            </select>

            <label for="port-select">Port:</label>
            <select id="port-select">
                <option value="">Auto-Detect</option>
            </select>

            <button onclick="loadTemplate('blink')">Template: Blink</button>
            <button onclick="loadTemplate('telemetry')">Template: Telemetry</button>
            <button onclick="compileCode()" class="primary">Build</button>
            <button onclick="flashCode()" class="success">Flash</button>
            <button onclick="runSimulation()">Simulate</button>
        </div>
    </header>

    <div class="main-container">
        <div class="editor-pane">
            <div class="pane-header">
                <span>C++ Sketch (TahakomAVRLib)</span>
                <span id="build-status">Ready</span>
            </div>
            <textarea id="code-editor" spellcheck="false"></textarea>
        </div>

        <div class="dashboard-pane">
            <div class="card">
                <div class="card-title">📈 Real-Time Virtual Oscilloscope (ADC Signal Channel 0)</div>
                <canvas id="scopeCanvas"></canvas>
            </div>

            <div class="card">
                <div class="card-title">📊 Digital Logic Analyzer (Pin Signals)</div>
                <canvas id="logicCanvas"></canvas>
            </div>

            <div class="card">
                <div class="card-title">🎛️ Live Hardware Telemetry Widgets</div>
                <div class="widget-grid">
                    <div class="widget">
                        <div>ADC Ch0</div>
                        <div class="widget-val" id="val-adc0">0</div>
                    </div>
                    <div class="widget">
                        <div>Pin PB0 State</div>
                        <div class="widget-val" id="val-pb0">LOW</div>
                    </div>
                    <div class="widget">
                        <div>Motor Position</div>
                        <div class="widget-val" id="val-motor">0</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="terminal-pane" id="terminal">
        [System] TahakomAVR Local Development Platform ready.
    </div>

    <script src="js/scope.js"></script>
    <script src="js/configurator.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
