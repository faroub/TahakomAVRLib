name: TahakomAVR CI & Simulator Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-test-simulate:
    name: Build, Test & Hardware Simulation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AVR Toolchain & simavr Simulator
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr binutils-avr avr-libc avrdude simavr build-essential

      - name: 1. Verify AVR Cross-Compilation Baseline
        run: |
          chmod +x scripts/check_build.sh
          scripts/check_build.sh

      - name: 2. Run Host Register Unit Tests
        run: |
          make -C tests/host test

      - name: 3. Run simavr Hardware Simulator Tests
        run: |
          chmod +x scripts/run_simavr_tests.sh
          scripts/run_simavr_tests.sh

      - name: 4. Run Development Server API Smoke Tests
        run: |
          chmod +x scripts/test_server_ci.py
          python3 scripts/test_server_ci.py
